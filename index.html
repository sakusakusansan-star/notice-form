<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>お知らせ投稿 | Sieg 業務ポータル</title>
<meta name="theme-color" content="#EFF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="stylesheet" href="sieg-theme.css">
<style>
  :root {
    --bg: var(--sg-bg);
    --bg2: var(--sg-bg);
    --panel: var(--sg-surface);
    --panel2: var(--sg-sunk);
    --line: var(--sg-hair);
    --amber: var(--sg-primary);
    --amber2: var(--sg-amber);
    --text: var(--sg-ink);
    --muted: var(--sg-mute);
    --muted2: var(--sg-faint);
    --ink: var(--sg-on-primary);
    --green: var(--sg-green);
    --red: var(--sg-red);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--sg-font);
    background: var(--sg-bg);
    color: var(--text);
    min-height: 100vh;
    padding: 22px 14px 40px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .head {
    padding: 4px 4px 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .eyebrow {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--amber);
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .title { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-top: 6px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .field { margin-bottom: 20px; }
  .label {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px;
    min-height: 44px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .chip.on {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  .chip:active { transform: scale(0.96); }

  textarea, input[type="date"], input[type="text"] {
    width: 100%;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    padding: 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--amber); }
  input[type="date"] {  }
  .hint { font-size: 11px; color: var(--muted2); margin-top: 6px; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    min-height: 54px;
    background: var(--amber);
    border: none;
    border-radius: 12px;
    color: var(--ink);
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: .5; }

  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .msg.ok { display: block; background: var(--sg-green-tint); border: 1px solid var(--sg-green); color: var(--green); }
  .msg.ng { display: block; background: var(--sg-red-tint); border: 1px solid var(--sg-red); color: var(--red); }

  .foot {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted2);
    text-align: center;
    margin-top: 22px;
  }

  /* ═══ 投稿済み一覧 ═══ */
  .list-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .list-title {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--amber2);
  }
  .list-refresh {
    font-size: 11px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .list-empty {
    padding: 18px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted2);
  }
  .notice-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
  }
  .notice-row + .notice-row { border-top: 1px dashed var(--sg-sunk); }
  .notice-row.expired { opacity: 0.45; }
  .notice-row-main { min-width: 0; }
  .notice-row-meta {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 4px;
  }
  .notice-row-chip {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 6px;
    padding: 2px 6px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .notice-row-chip.t-meet { background: var(--sg-amber-tint); border-color: var(--sg-amber); color: var(--amber2); }
  .notice-row-chip.t-imp { background: var(--sg-red-tint); border-color: var(--sg-red); color: var(--red); }
  .notice-row-name { font-size: 11px; color: var(--muted); }
  .notice-row-text {
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notice-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .row-btn {
    min-width: 44px;
    min-height: 36px;
    padding: 0 10px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .row-btn.del { color: var(--red); border-color: var(--sg-red); }
  .row-btn:active { transform: scale(0.95); }

  .editing-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--amber2);
    background: var(--sg-amber-tint);
    border: 1px solid var(--sg-amber);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .editing-cancel {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow::before { animation: none; }
  }

  /* ═══ 共通の見た目（sieg-theme.css）に合わせる ═══ */
  .eyebrow { color: var(--sg-amber); letter-spacing: .14em; }
  .eyebrow::before { background: var(--sg-amber); }
  .card, .list-card { border-radius: var(--sg-r); box-shadow: var(--sg-lift); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .head { border-bottom: none; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--sg-ink2); }
  .list-title { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--sg-ink); }
  .chip, textarea, input[type="date"], input[type="text"], .submit-btn { border-radius: var(--sg-r-sm); }
  .notice-row + .notice-row { border-top: 1px solid var(--sg-hair2); }
  .foot { font-size: 10px; letter-spacing: .1em; }
  /* 投稿の入力欄を先に、投稿済みの一覧はその下に */
  .list-card.list-below { margin: 18px 0 0; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div data-sieg-back="dark"></div>
    <div class="eyebrow">Sieg 業務ポータル</div>
    <div class="title">お知らせ投稿</div>
    <div class="sub">ここで投稿すると、ポータルのお知らせに表示されます。過去の投稿の編集・削除は下の一覧から</div>
  </div>

  <div class="card">

    <div class="editing-badge" id="editing-badge" style="display:none;">
      ✎ 編集中のお知らせがあります
      <span class="editing-cancel" onclick="cancelEdit()">キャンセル</span>
    </div>

    <div class="field">
      <div class="label">投稿者</div>
      <div class="chips" id="name-chips"></div>
    </div>

    <div class="field">
      <div class="label">種別</div>
      <div class="chips" id="type-chips"></div>
    </div>

    <div class="field">
      <div class="label">内容</div>
      <textarea id="text" placeholder="例：全体会議を行います"></textarea>
    </div>

    <div class="field">
      <div class="label">いつ（日程）</div>
      <input type="date" id="when">
      <input type="text" id="time" placeholder="時間・場所など（例：10:00〜 本社2F）" style="margin-top:8px;">
      <div class="hint">会議など日程がある場合に入力（任意）。入力すると表示期限も自動でその日に合わせます</div>
    </div>

    <div class="field">
      <div class="label">表示期限</div>
      <input type="date" id="expire">
      <div class="hint">この日を過ぎると自動的に非表示になります（初期値：2週間後）</div>
    </div>

    <button class="submit-btn" id="submit" onclick="post()">投稿する</button>
    <div class="msg" id="msg"></div>

  </div>

  <!-- ═══ 投稿済み一覧 ═══ -->
  <div class="list-card list-below">
    <div class="list-head">
      <span class="list-title">投稿済み一覧</span>
      <span class="list-refresh" onclick="loadList()">↻ 更新</span>
    </div>
    <div id="list-body">
      <div class="list-empty">読み込み中…</div>
    </div>
  </div>

  <div class="foot">Sieg 業務ポータル ・ 熊本</div>

</div>

<script src="gas-client.js"></script>
<script src="sieg-nav.js"></script>
<script>
  // ═══ 設定：GASデプロイURLを貼る ═══
  var NOTICE_API = 'https://script.google.com/macros/s/AKfycbxA1xDkeYuLRSo39iZju6-RUirpwAQbou_WjYe2G0t7KAQJAEADPgl8-56FW9jWzSvT/exec';
  // 投稿・更新・削除に付ける合言葉。gas/Code.gs の NOTICE_TOKEN と同じ文字列にする。
  var NOTICE_TOKEN = 'sieg-notice-2026';

  var NAMES = ['福山', '古川', '清田', '福岡'];
  var TYPES = ['お知らせ', '会議', '重要'];

  // 投稿者の初期値：前回この端末で投稿した名前 → ポータルで選んだ名前
  var NAME_KEY = 'noticeName';
  function defaultName() {
    var last = '';
    try { last = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    return NAMES.indexOf(last) >= 0 ? last : SiegNav.staff(NAMES);
  }
  var selName = defaultName();
  var selType = 'お知らせ';
  var editingId = null; // nullなら新規投稿モード

  function buildChips(boxId, list, initial, onPick) {
    var box = document.getElementById(boxId);
    box.innerHTML = '';
    list.forEach(function(v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (v === initial ? ' on' : '');
      b.textContent = v;
      b.onclick = function() {
        box.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('on'); });
        b.classList.add('on');
        onPick(v);
      };
      box.appendChild(b);
    });
  }
  function selectChip(boxId, value) {
    var box = document.getElementById(boxId);
    box.querySelectorAll('.chip').forEach(function(c) {
      c.classList.toggle('on', c.textContent === value);
    });
  }
  buildChips('name-chips', NAMES, selName, function(v) { selName = v; });
  buildChips('type-chips', TYPES, 'お知らせ', function(v) { selType = v; });

  // 表示期限の初期値：2週間後
  (function() {
    var d = new Date();
    d.setDate(d.getDate() + 14);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('expire').value = y + '-' + m + '-' + dd;
  })();

  // 日程を選んだら表示期限をその日に自動セット
  document.getElementById('when').addEventListener('change', function() {
    if (this.value) document.getElementById('expire').value = this.value;
  });

  function showMsg(ok, text) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  function post() {
    var text = document.getElementById('text').value.trim();
    if (!selName) { showMsg(false, '投稿者を選んでください'); return; }
    if (!text) { showMsg(false, '内容を入力してください'); return; }

    var btn = document.getElementById('submit');
    btn.disabled = true;
    btn.textContent = editingId ? '更新中…' : '送信中…';

    var payload = {
      token: NOTICE_TOKEN,
      action: editingId ? 'update' : 'create',
      name: selName,
      type: selType,
      text: text,
      when: document.getElementById('when').value,
      time: document.getElementById('time').value.trim(),
      expire: document.getElementById('expire').value
    };
    if (editingId) payload.id = editingId;
    else payload.requestId = requestIdFor(payload);

    // 更新は同じ内容で上書きするだけなので、一時的な失敗は自動でやり直す。
    // 新規投稿はやり直すと二重投稿になるので、やり直さない。
    GasClient.post(NOTICE_API, payload, { retry: payload.action === 'update' })
    .then(function(data) {
      if (data && data.ok) {
        try { localStorage.setItem(NAME_KEY, selName); } catch (e) {}
        showMsg(true, editingId ? '更新しました' : '投稿しました。ポータルに表示されます');
        resetFormFields();
        loadList();
      } else {
        showMsg(false, 'エラー：' + (data && data.error ? data.error : '不明なエラー'));
      }
    })
    .catch(function(err) {
      // 以前はここで「送信しました」と出して入力を消していたため、
      // 電波が悪いと投稿が黙って消えていた。入力は残したまま知らせる。
      showMsg(false, err.maybeDone
        ? '通信が途中で切れました。下の一覧に出ていれば投稿済みです。出ていなければ、このままもう一度「投稿する」を押してください。'
        : '送信できませんでした：' + err.message + '（入力内容は残っています）');
      loadList();
    })
    .then(function() {
      btn.disabled = false;
      btn.textContent = editingId ? '更新する' : '投稿する';
    });
  }

  // 新規投稿の送信ID。同じ内容を送り直すときは同じIDを使い、GAS側で二重投稿を防ぐ。
  // 投稿に成功したら忘れるので、次の投稿には新しいIDが付く。
  var lastRequest = null;
  function requestIdFor(p) {
    var key = JSON.stringify(p);
    if (lastRequest && lastRequest.key === key) return lastRequest.id;
    lastRequest = { key: key, id: GasClient.newId() };
    return lastRequest.id;
  }

  function resetFormFields() {
    lastRequest = null;
    editingId = null;
    document.getElementById('editing-badge').style.display = 'none';
    document.getElementById('submit').textContent = '投稿する';
    selName = defaultName();
    selType = 'お知らせ';
    selectChip('name-chips', selName);
    selectChip('type-chips', 'お知らせ');
    document.getElementById('text').value = '';
    document.getElementById('when').value = '';
    document.getElementById('time').value = '';
    var d = new Date();
    d.setDate(d.getDate() + 14);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('expire').value = y + '-' + m + '-' + dd;
  }

  function cancelEdit() {
    resetFormFields();
    document.getElementById('msg').className = 'msg';
  }

  // ═══ 投稿済み一覧 ═══
  function loadList() {
    var box = document.getElementById('list-body');
    box.innerHTML = '<div class="list-empty">読み込み中…</div>';
    GasClient.get(NOTICE_API, { mode: 'edit' })
      .then(function(data) {
        if (!data || !data.ok || !data.items || !data.items.length) {
          box.innerHTML = '<div class="list-empty">投稿はまだありません</div>';
          return;
        }
        box.innerHTML = '';
        var today = new Date(); today.setHours(0,0,0,0);
        data.items.forEach(function(it) {
          var row = document.createElement('div');
          row.className = 'notice-row';
          if (it.expire) {
            var exp = new Date(it.expire);
            if (exp < today) row.classList.add('expired');
          }

          var main = document.createElement('div');
          main.className = 'notice-row-main';

          var meta = document.createElement('div');
          meta.className = 'notice-row-meta';
          var chip = document.createElement('span');
          chip.className = 'notice-row-chip' +
            (it.type === '会議' ? ' t-meet' : it.type === '重要' ? ' t-imp' : '');
          chip.textContent = it.type || 'お知らせ';
          var name = document.createElement('span');
          name.className = 'notice-row-name';
          name.textContent = it.name || '';
          meta.appendChild(chip);
          meta.appendChild(name);

          var text = document.createElement('div');
          text.className = 'notice-row-text';
          text.textContent = it.text || '';

          main.appendChild(meta);
          main.appendChild(text);

          var actions = document.createElement('div');
          actions.className = 'notice-row-actions';

          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'row-btn';
          editBtn.textContent = '編集';
          editBtn.onclick = function() { startEdit(it); };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'row-btn del';
          delBtn.textContent = '削除';
          delBtn.onclick = function() { deleteNotice(it.id); };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          row.appendChild(main);
          row.appendChild(actions);
          box.appendChild(row);
        });
      })
      .catch(function(err) {
        box.innerHTML = '';
        var msg = document.createElement('div');
        msg.className = 'list-empty';
        msg.textContent = '読み込みに失敗しました（' + err.message + '）';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'row-btn';
        retry.textContent = 'もう一度読み込む';
        retry.onclick = loadList;
        box.appendChild(msg);
        box.appendChild(retry);
      });
  }

  function startEdit(it) {
    editingId = it.id;
    selName = it.name || '';
    selType = it.type || 'お知らせ';
    selectChip('name-chips', selName);
    selectChip('type-chips', selType);
    document.getElementById('text').value = it.text || '';
    document.getElementById('when').value = it.when || '';
    document.getElementById('time').value = it.time || '';
    document.getElementById('expire').value = it.expire || '';
    document.getElementById('editing-badge').style.display = 'flex';
    document.getElementById('submit').textContent = '更新する';
    document.getElementById('msg').className = 'msg';
    window.scrollTo(0, document.querySelector('.card').offsetTop - 10);
  }

  function deleteNotice(id) {
    if (!confirm('このお知らせを削除しますか？')) return;
    // IDを指定して消すだけなので、やり直しても結果は同じ
    GasClient.post(NOTICE_API, { token: NOTICE_TOKEN, action: 'delete', id: id }, { retry: true })
    .then(function(data) {
      if (data && data.ok) {
        if (editingId === id) cancelEdit();
        loadList();
      } else {
        alert('削除に失敗しました：' + (data && data.error ? data.error : '不明なエラー'));
      }
    })
    .catch(function(err) {
      alert('削除できませんでした：' + err.message);
      loadList();
    });
  }

  loadList();
</script>
</body>
</html>
