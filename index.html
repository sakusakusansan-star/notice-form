<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お知らせ投稿 | Sieg 業務ポータル</title>
<meta name="theme-color" content="#EFF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1015" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<!-- Google（GAS）への接続を先に始めておく（最初の読み込みが少し早くなる） -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="sieg-theme.css">
<style>
  :root {
    --bg: var(--sg-bg);
    --bg2: var(--sg-bg);
    --panel: var(--sg-surface);
    --panel2: var(--sg-sunk);
    --line: var(--sg-hair);
    --amber: var(--sg-primary);
    --amber2: var(--sg-amber);
    --text: var(--sg-ink);
    --muted: var(--sg-mute);
    --muted2: var(--sg-faint);
    --ink: var(--sg-on-primary);
    --green: var(--sg-green);
    --red: var(--sg-red);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: var(--sg-font);
    background: var(--sg-bg);
    color: var(--text);
    min-height: 100vh;
    padding: 22px 14px 40px;
  }
  .head-note { font-size: 12px; color: var(--muted); margin: -6px 2px 16px; line-height: 1.6; }

  .head {
    padding: 4px 4px 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .eyebrow {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--amber);
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .title { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-top: 6px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .field { margin-bottom: 20px; }
  .label {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px;
    min-height: 44px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .chip.on {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  .chip:active { transform: scale(0.96); }
  .chips.small .chip { min-height: 38px; padding: 7px 12px; font-size: 13.5px; }
  .chip:disabled { opacity: .4; cursor: default; }
  /* 欄の並び：会議のときは日程を内容の前に */
  .fields { display: flex; flex-direction: column; }
  .f-type { order: 1; } .f-text { order: 3; } .f-when { order: 4; } .f-expire { order: 5; }
  .fields.meet .f-when { order: 2; }
  .need { display: none; margin-left: 8px; font-size: 11px; font-weight: 800; letter-spacing: 0; color: var(--sg-amber, #8A5A00); }
  .fields.meet .need { display: inline; }
  .fields.meet.has-when .need { display: none; }
  .when-open { width: 100%; min-height: 44px; border: 1.5px dashed var(--line); border-radius: var(--sg-r-sm, 10px); background: none; color: var(--sg-ink2, var(--text)); font: 700 14px/1 var(--sg-font, inherit); cursor: pointer; }
  .when-open[hidden], #when-box[hidden] { display: none; }

  textarea, input[type="date"], input[type="text"] {
    width: 100%;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    padding: 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--amber); }
  input[type="date"] {  }
  .hint { font-size: 11px; color: var(--muted2); margin-top: 6px; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    min-height: 54px;
    background: var(--amber);
    border: none;
    border-radius: 12px;
    color: var(--ink);
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: .5; }

  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .msg.ok { display: block; background: var(--sg-green-tint); border: 1px solid var(--sg-green); color: var(--green); }
  .msg.ng { display: block; background: var(--sg-red-tint); border: 1px solid var(--sg-red); color: var(--red); }

  .foot {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted2);
    text-align: center;
    margin-top: 22px;
  }

  /* ═══ 投稿済み一覧 ═══ */
  .list-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .list-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .list-title {
    font-family: var(--sg-font); font-variant-numeric: tabular-nums;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--amber2);
  }
  .list-refresh {
    font-size: 11px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .list-empty {
    padding: 18px 16px;
    text-align: center;
    font-size: 12px;
    color: var(--muted2);
  }
  .notice-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
  }
  .notice-row + .notice-row { border-top: 1px dashed var(--sg-sunk); }
  .notice-row.expired { opacity: 0.55; }
  .notice-row-sub { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .notice-row-sub b { font-weight: 800; color: var(--sg-ink2, var(--text)); }
  .notice-row-sub .soon { color: var(--sg-amber, #8A5A00); font-weight: 800; }
  .notice-row-chip.t-exp { background: var(--sg-sunk); color: var(--muted); }
  .exp-toggle { display: block; width: calc(100% - 32px); margin: 8px 16px 12px; min-height: 40px; border: 1px solid var(--line); border-radius: var(--sg-r-sm, 10px); background: var(--sg-sunk); color: var(--muted); font: 700 13px/1 var(--sg-font, inherit); cursor: pointer; }
  .notice-row-main { min-width: 0; }
  .notice-row-meta {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 4px;
  }
  .notice-row-chip {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    border-radius: 6px;
    padding: 2px 6px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  .notice-row-chip.t-meet { background: var(--sg-amber-tint); border-color: var(--sg-amber); color: var(--amber2); }
  .notice-row-chip.t-imp { background: var(--sg-red-tint); border-color: var(--sg-red); color: var(--red); }
  .notice-row-name { font-size: 11px; color: var(--muted); }
  .notice-row-text {
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notice-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .row-btn {
    min-width: 44px;
    min-height: 36px;
    padding: 0 10px;
    background: var(--sg-sunk);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .row-btn.del { color: var(--red); border-color: var(--sg-red); }
  .row-btn:active { transform: scale(0.95); }

  .editing-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--amber2);
    background: var(--sg-amber-tint);
    border: 1px solid var(--sg-amber);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .editing-cancel {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow::before { animation: none; }
  }

  /* ═══ 共通の見た目（sieg-theme.css）に合わせる ═══ */
  .eyebrow { color: var(--sg-amber); letter-spacing: .14em; }
  .eyebrow::before { background: var(--sg-amber); }
  .card, .list-card { border-radius: var(--sg-r); box-shadow: var(--sg-lift); backdrop-filter: none; -webkit-backdrop-filter: none; }
  .head { border-bottom: none; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--sg-ink2); }
  .list-title { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--sg-ink); }
  .chip, textarea, input[type="date"], input[type="text"], .submit-btn { border-radius: var(--sg-r-sm); }
  .notice-row + .notice-row { border-top: 1px solid var(--sg-hair2); }
  .foot { font-size: 10px; letter-spacing: .1em; }
  /* 投稿の入力欄を先に、投稿済みの一覧はその下に */
  .list-card.list-below { margin: 18px 0 0; }
</style>
</head>
<body class="has-actionbar">
<div class="wrap sg-page">

  <div data-sieg-back="dark"></div>
  <header class="sg-head">
    <div>
      <div class="sg-eyebrow">Sieg 業務ポータル</div>
      <h1 class="sg-title">お知らせ投稿</h1>
    </div>
    <!-- 投稿者。押すと名前を選ぶシートが出る（どのツールも同じ） -->
    <button type="button" class="sg-who" id="who" aria-label="投稿者を選ぶ"><i id="who-initial">?</i><span id="who-name">未選択</span></button>
  </header>
  <p class="head-note">ここで投稿すると、ポータルのお知らせに表示されます。過去の投稿の編集・削除は下の一覧から</p>

  <div class="card">

    <div class="editing-badge" id="editing-badge" style="display:none;">
      <svg class="sg-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg> 編集中のお知らせがあります
      <span class="editing-cancel" onclick="cancelEdit()">キャンセル</span>
    </div>

    <!-- 欄の並び：会議のときは日程を内容の前に出す（.meet） -->
    <div class="fields" id="fields">
    <div class="field f-type">
      <div class="label">種別</div>
      <div class="chips" id="type-chips"></div>
    </div>

    <div class="field f-text">
      <div class="label">内容</div>
      <textarea id="text" placeholder="例：全体会議を行います"></textarea>
    </div>

    <div class="field f-when">
      <div class="label">いつ（日程）<span class="need" id="when-need">会議は日程を入れてください</span></div>
      <button type="button" class="when-open" id="when-open">＋ 日程を入れる（任意）</button>
      <div id="when-box">
        <input type="date" id="when" aria-label="日程の日付">
        <input type="text" id="time" placeholder="時間・場所など（例：10:00〜 本社2F）" style="margin-top:8px;" aria-label="時間・場所">
        <div class="hint">日程を入れると、表示期限もその日に合わせます</div>
      </div>
    </div>

    <div class="field f-expire">
      <div class="label">表示期限</div>
      <div class="chips small" id="expire-chips" role="group" aria-label="表示期限をえらぶ"></div>
      <input type="date" id="expire" style="margin-top:8px;" aria-label="表示期限の日付">
      <div class="hint">この日を過ぎると、ポータルのお知らせに出なくなります</div>
    </div>
    </div>

    <div class="msg" id="msg"></div>

  </div>

  <!-- 投稿ボタンは画面の下に固定 -->
  <div class="sg-actionbar"><button class="sg-primary" id="submit" onclick="post()">送信する</button></div>

  <!-- ═══ 投稿済み一覧 ═══ -->
  <div class="list-card list-below">
    <div class="list-head">
      <span class="list-title">投稿済み一覧</span>
      <span class="list-refresh" onclick="loadList()">↻ 更新</span>
    </div>
    <div id="list-body">
      <div class="sg-skel-wrap" aria-busy="true" aria-label="読み込み中"><div class="sg-skel card"></div><div class="sg-skel card"></div><div class="sg-skel card"></div></div>
    </div>
  </div>

  <div class="foot">Sieg 業務ポータル ・ 熊本</div>

</div>

<script src="gas-client.js"></script>
<script src="sieg-nav.js"></script>
<script src="/sieg-portal/sieg-roster.js"></script>
<script>
  // ═══ 設定：GASデプロイURLを貼る ═══
  var NOTICE_API = 'https://script.google.com/macros/s/AKfycbxA1xDkeYuLRSo39iZju6-RUirpwAQbou_WjYe2G0t7KAQJAEADPgl8-56FW9jWzSvT/exec';

  // 名前の一覧はポータルの名簿（sieg-roster.js）の「掲示板に投稿する人」
  var NAMES = window.SiegRoster ? SiegRoster.forTool('notice') : [];
  // 名簿（/sieg-portal/sieg-roster.js）が読めなかったときは、再読み込みをお願いする
  if (!window.SiegRoster) {
    document.addEventListener('DOMContentLoaded', function() {
      var d = document.createElement('div');
      d.style.cssText = 'margin:10px 16px;padding:10px 14px;border-radius:12px;background:var(--sg-red-tint,#F9EAE8);color:var(--sg-red,#AE2B24);font-weight:700;font-size:14px';
      d.textContent = '名前の一覧を読み込めませんでした。電波のよいところで再読み込みしてください。';
      document.body.insertBefore(d, document.body.firstChild);
    });
  }

  var TYPES = ['お知らせ', '会議', '重要'];

  // 投稿者の初期値：前回この端末で投稿した名前 → ポータルで選んだ名前
  var NAME_KEY = 'noticeName';
  function defaultName() {
    var last = '';
    try { last = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    return NAMES.indexOf(last) >= 0 ? last : SiegNav.staff(NAMES);
  }
  var selName = defaultName();
  var selType = 'お知らせ';
  var editingId = null; // nullなら新規投稿モード

  function buildChips(boxId, list, initial, onPick) {
    var box = document.getElementById(boxId);
    box.innerHTML = '';
    list.forEach(function(v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (v === initial ? ' on' : '');
      b.textContent = v;
      b.onclick = function() {
        box.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('on'); });
        b.classList.add('on');
        onPick(v);
      };
      box.appendChild(b);
    });
  }
  function selectChip(boxId, value) {
    var box = document.getElementById(boxId);
    box.querySelectorAll('.chip').forEach(function(c) {
      c.classList.toggle('on', c.textContent === value);
    });
  }
  // 右上の投稿者の表示
  function paintWho() {
    document.getElementById('who-name').textContent = selName || '名前を選ぶ';
    document.getElementById('who-name').classList.toggle('unset', !selName);
    document.getElementById('who-initial').textContent = selName ? String(selName).charAt(0) : '?';
  }
  paintWho();
  function pickWho() {
    return SiegNav.pickName(NAMES, selName, { title: '投稿者を選ぶ' }).then(function(n) { if (n) { selName = n; paintWho(); } return n; });
  }
  document.getElementById('who').addEventListener('click', pickWho);
  buildChips('type-chips', TYPES, 'お知らせ', function(v) { selType = v; applyType(); });

  // ── 日付の小道具 ──
  var DOW = ['日', '月', '火', '水', '木', '金', '土'];
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseYmd(v) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function md(d) { return (d.getMonth() + 1) + '/' + d.getDate() + '(' + DOW[d.getDay()] + ')'; }
  function today0() { var t = new Date(); t.setHours(0, 0, 0, 0); return t; }
  function addDays(n) { var d = today0(); d.setDate(d.getDate() + n); return ymd(d); }
  function addMonth1() { var d = today0(), day = d.getDate(); d.setMonth(d.getMonth() + 1); if (d.getDate() !== day) d.setDate(0); return ymd(d); }

  // ── 種別に合わせて欄を並べ替える ──
  // 会議：日程を内容の前に出して、いつも開いておく。お知らせ・重要：日程はたたんでおく（入っていれば開く）
  var whenOpened = false;
  function applyType() {
    var meet = selType === '会議';
    var has = !!(document.getElementById('when').value || document.getElementById('time').value.trim());
    var open = meet || has || whenOpened;
    document.getElementById('fields').classList.toggle('meet', meet);
    document.getElementById('fields').classList.toggle('has-when', !!document.getElementById('when').value);
    document.getElementById('when-open').hidden = open;
    document.getElementById('when-box').hidden = !open;
  }
  document.getElementById('when-open').addEventListener('click', function() {
    whenOpened = true; applyType();
    try { document.getElementById('when').focus(); } catch (e) {}
  });

  // ── 表示期限：ボタンでえらぶ（日付の欄でも直せる） ──
  var EXPIRE_CHOICES = [
    { label: '1週間', get: function() { return addDays(7); } },
    { label: '2週間', get: function() { return addDays(14); } },
    { label: '1か月', get: function() { return addMonth1(); } },
    { label: '日程の日まで', get: function() { return document.getElementById('when').value; }, needWhen: true }
  ];
  function paintExpire() {
    var box = document.getElementById('expire-chips'), cur = document.getElementById('expire').value;
    var hasWhen = !!document.getElementById('when').value;
    box.innerHTML = '';
    var picked = false;
    EXPIRE_CHOICES.forEach(function(c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = c.label;
      if (c.needWhen && !hasWhen) { b.disabled = true; b.title = '日程を入れると選べます'; }
      // 日程の日と同じなら「日程の日まで」を優先して光らせる
      var v = c.get();
      var on = !picked && v && v === cur && (c.needWhen || !(hasWhen && cur === document.getElementById('when').value));
      if (on) { b.classList.add('on'); picked = true; }
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.onclick = function() { var nv = c.get(); if (!nv) return; document.getElementById('expire').value = nv; paintExpire(); };
      box.appendChild(b);
    });
  }
  document.getElementById('expire').value = addDays(14);   // 初めは2週間後
  document.getElementById('expire').addEventListener('change', paintExpire);

  // 日程を選んだら表示期限をその日に自動セット
  document.getElementById('when').addEventListener('change', function() {
    if (this.value) document.getElementById('expire').value = this.value;
    paintExpire(); applyType();
  });
  applyType(); paintExpire();

  function showMsg(ok, text) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  function post() {
    var text = document.getElementById('text').value.trim();
    if (!selName) { pickWho(); return; }
    if (!text) { showMsg(false, '内容を入力してください'); return; }
    if (selType === '会議' && !document.getElementById('when').value) {
      SiegNav.confirm('会議の日程が入っていません。ポータルに「あと○日」が出ません。', { title: 'このまま送りますか？', ok: 'このまま送る', cancel: '日程を入れる' })
        .then(function(yes) { if (yes) send(text); else { try { document.getElementById('when').focus(); } catch (e) {} } });
      return;
    }
    send(text);
  }

  function send(text) {

    var btn = document.getElementById('submit');
    btn.disabled = true;
    btn.textContent = editingId ? '更新中…' : '送信中…';

    var payload = {
      action: editingId ? 'update' : 'create',
      name: selName,
      type: selType,
      text: text,
      when: document.getElementById('when').value,
      time: document.getElementById('time').value.trim(),
      expire: document.getElementById('expire').value
    };
    if (editingId) payload.id = editingId;
    else payload.requestId = requestIdFor(payload);

    // 更新は同じ内容で上書きするだけなので、一時的な失敗は自動でやり直す。
    // 新規投稿はやり直すと二重投稿になるので、やり直さない。
    SiegNav.flushUndo().then(function() { return GasClient.post(NOTICE_API, payload, { retry: payload.action === 'update' }); })
    .then(function(data) {
      if (data && data.ok) {
        try { localStorage.setItem(NAME_KEY, selName); } catch (e) {}
        var wasEdit = !!editingId;
        document.getElementById('msg').className = 'msg';
        resetFormFields();
        loadList();
        // 送ったあと：どのツールも同じ形で知らせる（次にやることを並べる）
        SiegNav.done({ title: wasEdit ? '更新しました' : '送信しました', sub: 'ポータルのお知らせに表示されます', next: [
          { label: '続けて投稿する' }, { label: 'ポータルで見る', href: SiegNav.portalUrl }
        ] });
      } else {
        showMsg(false, 'エラー：' + (data && data.error ? data.error : '不明なエラー'));
      }
    })
    .catch(function(err) {
      // 以前はここで「送信しました」と出して入力を消していたため、
      // 電波が悪いと投稿が黙って消えていた。入力は残したまま知らせる。
      showMsg(false, err.maybeDone
        ? '通信が途中で切れました。下の一覧に出ていれば投稿済みです。出ていなければ、このままもう一度「送信する」を押してください。'
        : '送信できませんでした：' + err.message + '（入力内容は残っています）');
      loadList();
    })
    .then(function() {
      btn.disabled = false;
      btn.textContent = editingId ? '更新する' : '送信する';
    });
  }

  // 新規投稿の送信ID。同じ内容を送り直すときは同じIDを使い、GAS側で二重投稿を防ぐ。
  // 投稿に成功したら忘れるので、次の投稿には新しいIDが付く。
  var lastRequest = null;
  function requestIdFor(p) {
    var key = JSON.stringify(p);
    if (lastRequest && lastRequest.key === key) return lastRequest.id;
    lastRequest = { key: key, id: GasClient.newId() };
    return lastRequest.id;
  }

  function resetFormFields() {
    lastRequest = null;
    editingId = null;
    document.getElementById('editing-badge').style.display = 'none';
    document.getElementById('submit').textContent = '送信する';
    selName = defaultName();
    selType = 'お知らせ';
    paintWho();
    selectChip('type-chips', 'お知らせ');
    document.getElementById('text').value = '';
    document.getElementById('when').value = '';
    document.getElementById('time').value = '';
    document.getElementById('expire').value = addDays(14);
    whenOpened = false;
    applyType(); paintExpire();
  }

  function cancelEdit() {
    resetFormFields();
    document.getElementById('msg').className = 'msg';
  }

  // 一覧の1行：種別・名前（期限切れの印）、本文、日程と表示期限
  var showExpired = false;
  function rowFor(it, expired) {
    var today = today0();
    var row = document.createElement('div');
    row.className = 'notice-row' + (expired ? ' expired' : '');
          var main = document.createElement('div');
          main.className = 'notice-row-main';

          var meta = document.createElement('div');
          meta.className = 'notice-row-meta';
          var chip = document.createElement('span');
          chip.className = 'notice-row-chip' +
            (it.type === '会議' ? ' t-meet' : it.type === '重要' ? ' t-imp' : '');
          chip.textContent = it.type || 'お知らせ';
          var name = document.createElement('span');
          name.className = 'notice-row-name';
          name.textContent = it.name || '';
          meta.appendChild(chip);
          if (expired) { var ex = document.createElement('span'); ex.className = 'notice-row-chip t-exp'; ex.textContent = '期限切れ'; meta.appendChild(ex); }
          meta.appendChild(name);

          var text = document.createElement('div');
          text.className = 'notice-row-text';
          text.textContent = it.text || '';

          main.appendChild(meta);
          main.appendChild(text);
          // 日程・表示期限
          var sub = document.createElement('div');
          sub.className = 'notice-row-sub';
          var w = parseYmd(it.when), e = parseYmd(it.expire);
          if (w || it.time) {
            var ws = document.createElement('span');
            ws.innerHTML = '日程 <b></b>';
            ws.querySelector('b').textContent = (w ? md(w) : '') + (it.time ? (w ? ' ' : '') + it.time : '');
            sub.appendChild(ws);
          }
          var es = document.createElement('span');
          if (!e) es.textContent = '期限なし';
          else if (expired) es.textContent = md(e) + 'まで表示（終了）';
          else {
            var left = Math.round((e - today) / 86400000);
            es.textContent = md(e) + 'まで表示' + (left === 0 ? '（きょうまで）' : left <= 3 ? '（あと' + left + '日）' : '');
            if (left <= 3) es.className = 'soon';
          }
          sub.appendChild(es);
          main.appendChild(sub);

          var actions = document.createElement('div');
          actions.className = 'notice-row-actions';

          var editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'row-btn';
          editBtn.textContent = '直す';
          editBtn.onclick = function() { startEdit(it); };

          var delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'row-btn del';
          delBtn.textContent = '消す';
          delBtn.onclick = function() { deleteNotice(it.id, delBtn); };

          actions.appendChild(editBtn);
          actions.appendChild(delBtn);

          row.appendChild(main);
          row.appendChild(actions);
    return row;
  }

  // ═══ 投稿済み一覧 ═══
  function loadList() {
    var box = document.getElementById('list-body');
    box.innerHTML = '<div class="sg-skel-wrap" aria-busy="true" aria-label="読み込み中"><div class="sg-skel card"></div><div class="sg-skel card"></div><div class="sg-skel card"></div></div>';
    GasClient.get(NOTICE_API, { mode: 'edit' })
      .then(function(data) {
        if (!data || !data.ok || !data.items || !data.items.length) {
          box.innerHTML = SiegNav.empty('投稿はまだありません', '上で内容を書いて送ると、ここに並びます');
          return;
        }
        box.innerHTML = '';
        var today = today0();
        // 期限切れは下にまとめて、ふだんはたたんでおく
        var live = [], old = [];
        data.items.forEach(function(it) { var e = parseYmd(it.expire); (e && e < today ? old : live).push(it); });
        live.forEach(function(it) { box.appendChild(rowFor(it, false)); });
        if (!live.length) box.innerHTML = '<div class="list-empty">いま表示中のお知らせはありません</div>';
        if (old.length) {
          var tg = document.createElement('button');
          tg.type = 'button';
          tg.className = 'exp-toggle';
          tg.id = 'exp-toggle';
          var wrap = document.createElement('div');
          wrap.id = 'exp-list';
          wrap.hidden = !showExpired;
          old.forEach(function(it) { wrap.appendChild(rowFor(it, true)); });
          var paintTg = function() { tg.textContent = (showExpired ? '期限切れをたたむ' : '期限切れ ' + old.length + '件を見る'); tg.setAttribute('aria-expanded', showExpired ? 'true' : 'false'); };
          tg.onclick = function() { showExpired = !showExpired; wrap.hidden = !showExpired; paintTg(); };
          paintTg();
          box.appendChild(tg);
          box.appendChild(wrap);
        }
      })
      .catch(function(err) {
        box.innerHTML = '';
        var msg = document.createElement('div');
        msg.className = 'list-empty';
        msg.textContent = '読み込みに失敗しました（' + err.message + '）';
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'row-btn';
        retry.textContent = 'もう一度読み込む';
        retry.onclick = loadList;
        box.appendChild(msg);
        box.appendChild(retry);
      });
  }

  function startEdit(it) {
    editingId = it.id;
    selName = it.name || '';
    selType = it.type || 'お知らせ';
    paintWho();
    selectChip('type-chips', selType);
    document.getElementById('text').value = it.text || '';
    document.getElementById('when').value = it.when || '';
    document.getElementById('time').value = it.time || '';
    document.getElementById('expire').value = it.expire || '';
    applyType(); paintExpire();
    document.getElementById('editing-badge').style.display = 'flex';
    document.getElementById('submit').textContent = '更新する';
    document.getElementById('msg').className = 'msg';
    window.scrollTo(0, document.querySelector('.card').offsetTop - 10);
  }

  // 削除：行をすぐ隠して「元に戻す」を出す。押されなければ5秒後に消す（SiegNav.undoable）
  function deleteNotice(id, btn) {
    var row = btn;
    while (row && row.parentNode && row.parentNode.id !== 'list-body') row = row.parentNode;
    SiegNav.undoable({
      text: 'お知らせを消しました', rows: row && row.parentNode ? row : null,
      // IDを指定して消すだけなので、やり直しても結果は同じ
      commit: function() {
        return GasClient.post(NOTICE_API, { action: 'delete', id: id }, { retry: true }).then(function(data) {
          if (!data || !data.ok) throw new Error(data && data.error ? data.error : '不明なエラー');
        });
      },
      onDone: function() { if (editingId === id) cancelEdit(); loadList(); },
      onFail: function() { loadList(); }
    });
  }

  loadList();
</script>
</body>
</html>
