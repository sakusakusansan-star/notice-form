<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>お知らせ投稿 | Sieg 業務ポータル</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<style>
  :root {
    --bg: #0B1220;
    --bg2: #101B30;
    --panel: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.10);
    --amber: #E8A33D;
    --amber2: #F4C56B;
    --text: #EDEFF3;
    --muted: #8A93A6;
    --muted2: #5C6579;
    --ink: #0B1220;
    --green: #4CD97B;
    --red: #E86A5A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(232,163,61,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 22px 14px 40px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .head {
    padding: 4px 4px 16px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 18px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--amber);
    display: flex; align-items: center; gap: 6px;
  }
  .eyebrow::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: blink 1.6s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .title { font-size: 24px; font-weight: 800; letter-spacing: 1px; margin-top: 6px; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .back-link {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    text-decoration: underline;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .field { margin-bottom: 20px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px;
    min-height: 44px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .chip.on {
    background: var(--amber);
    color: var(--ink);
    border-color: var(--amber);
  }
  .chip:active { transform: scale(0.96); }

  textarea, input[type="date"], input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    padding: 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--amber); }
  input[type="date"] { color-scheme: dark; }
  .hint { font-size: 11px; color: var(--muted2); margin-top: 6px; }

  .submit-btn {
    width: 100%;
    padding: 16px;
    min-height: 54px;
    background: var(--amber);
    border: none;
    border-radius: 12px;
    color: var(--ink);
    font-size: 17px;
    font-weight: 800;
    font-family: inherit;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform .08s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: .5; }

  .msg {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  .msg.ok { display: block; background: rgba(76,217,123,0.10); border: 1px solid rgba(76,217,123,0.4); color: var(--green); }
  .msg.ng { display: block; background: rgba(232,106,90,0.10); border: 1px solid rgba(232,106,90,0.4); color: var(--red); }

  .foot {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: var(--muted2);
    text-align: center;
    margin-top: 22px;
  }

  @media (prefers-reduced-motion: reduce) {
    .eyebrow::before { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="eyebrow">SIEG OPS BOARD</div>
    <div class="title">お知らせ投稿</div>
    <div class="sub">投稿するとポータルのトップに表示されます</div>
    <a class="back-link" href="https://sakusakusansan-star.github.io/sieg-portal/">‹ ポータルに戻る</a>
  </div>

  <div class="card">

    <div class="field">
      <div class="label">POSTED BY / 投稿者</div>
      <div class="chips" id="name-chips"></div>
    </div>

    <div class="field">
      <div class="label">TYPE / 種別</div>
      <div class="chips" id="type-chips"></div>
    </div>

    <div class="field">
      <div class="label">MESSAGE / 内容</div>
      <textarea id="text" placeholder="例：全体会議を行います"></textarea>
    </div>

    <div class="field">
      <div class="label">WHEN / いつ（日程）</div>
      <input type="date" id="when">
      <input type="text" id="time" placeholder="時間・場所など（例：10:00〜 本社2F）" style="margin-top:8px;">
      <div class="hint">会議など日程がある場合に入力（任意）。入力すると表示期限も自動でその日に合わせます</div>
    </div>

    <div class="field">
      <div class="label">DISPLAY UNTIL / 表示期限</div>
      <input type="date" id="expire">
      <div class="hint">この日を過ぎると自動的に非表示になります（初期値：2週間後）</div>
    </div>

    <button class="submit-btn" id="submit" onclick="post()">投稿する</button>
    <div class="msg" id="msg"></div>

  </div>

  <div class="foot">SIEG OPERATIONS PORTAL ★ KUMAMOTO</div>

</div>

<script>
  // ═══ 設定：GASデプロイURLを貼る ═══
  var NOTICE_API = 'https://script.google.com/macros/s/AKfycbxA1xDkeYuLRSo39iZju6-RUirpwAQbou_WjYe2G0t7KAQJAEADPgl8-56FW9jWzSvT/exec';

  var NAMES = ['福山', '古川', '清田', '福岡'];
  var TYPES = ['お知らせ', '会議', '重要'];

  var selName = '';
  var selType = 'お知らせ';

  function buildChips(boxId, list, initial, onPick) {
    var box = document.getElementById(boxId);
    list.forEach(function(v) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (v === initial ? ' on' : '');
      b.textContent = v;
      b.onclick = function() {
        box.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('on'); });
        b.classList.add('on');
        onPick(v);
      };
      box.appendChild(b);
    });
  }
  buildChips('name-chips', NAMES, '', function(v) { selName = v; });
  buildChips('type-chips', TYPES, 'お知らせ', function(v) { selType = v; });

  // 表示期限の初期値：2週間後
  (function() {
    var d = new Date();
    d.setDate(d.getDate() + 14);
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('expire').value = y + '-' + m + '-' + dd;
  })();

  // 日程を選んだら表示期限をその日に自動セット
  document.getElementById('when').addEventListener('change', function() {
    if (this.value) document.getElementById('expire').value = this.value;
  });

  function showMsg(ok, text) {
    var el = document.getElementById('msg');
    el.className = 'msg ' + (ok ? 'ok' : 'ng');
    el.textContent = text;
  }

  function post() {
    var text = document.getElementById('text').value.trim();
    if (!selName) { showMsg(false, '投稿者を選んでください'); return; }
    if (!text) { showMsg(false, '内容を入力してください'); return; }

    var btn = document.getElementById('submit');
    btn.disabled = true;
    btn.textContent = '送信中…';

    fetch(NOTICE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        name: selName,
        type: selType,
        text: text,
        when: document.getElementById('when').value,
        time: document.getElementById('time').value.trim(),
        expire: document.getElementById('expire').value
      })
    })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data && data.ok) {
        showMsg(true, '投稿しました。ポータルに表示されます');
        document.getElementById('text').value = '';
        document.getElementById('when').value = '';
        document.getElementById('time').value = '';
      } else {
        showMsg(false, 'エラー：' + (data && data.error ? data.error : '不明なエラー'));
      }
    })
    .catch(function() {
      // レスポンスが読めない環境でも送信自体は成功していることが多い
      showMsg(true, '送信しました（ポータルで表示を確認してください）');
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '投稿する';
    });
  }
</script>
</body>
</html>
